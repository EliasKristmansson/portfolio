<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>three.js shader background starter</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
        }

        canvas {
            display: block;
        }

        #label {
            position: fixed;
            bottom: 16px;
            left: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #999;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="label">move your mouse — scroll wheel changes color · fork this file to build on it</div>

    <!-- three.js loaded from a CDN as an ES module. No build step needed for this starter. -->
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
  }
}
</script>

    <script type="module">
        import * as THREE from 'three';

        /* ----------------------------------------------------------------------
           STEP 1 — the three things every three.js app needs:
           Scene (the world), Camera (the viewpoint), Renderer (draws it to a canvas)
        ---------------------------------------------------------------------- */
        const scene = new THREE.Scene();

        // Orthographic camera = no perspective distortion. Perfect for a full-screen
        // flat shader plane, since we're not building a 3D scene with depth here —
        // we're using the GPU to paint a 2D pattern across the whole viewport.
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap for perf
        document.body.appendChild(renderer.domElement);

        /* ----------------------------------------------------------------------
           STEP 2 — uniforms: the variables we hand from JS into the shader.
           Every frame we update uTime and uMouse; the GPU reads them for every
           single pixel it draws, in parallel. This is the whole trick behind
           shader backgrounds being cheap even though they look complex.
        ---------------------------------------------------------------------- */
        const uniforms = {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0.5, 0.5) },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uHueShift: { value: 0 }
        };

        /* ----------------------------------------------------------------------
           STEP 3 — geometry + material = mesh.
           PlaneGeometry(2,2) exactly fills the orthographic camera's view.
           The interesting part is the ShaderMaterial: we hand it raw GLSL.
        ---------------------------------------------------------------------- */
        const geometry = new THREE.PlaneGeometry(2, 2);

        // Vertex shader: runs once per vertex (we only have 4, corners of the plane).
        // It just passes UV coordinates through — all the visual work happens
        // per-pixel in the fragment shader below.
        const vertexShader = /* glsl */ `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
  }
`;

        // Fragment shader: runs once per PIXEL, in parallel, on the GPU.
        // This is where the actual "flowing gradient" effect comes from —
        // it's just math (sine waves + a cheap noise function) evaluated per pixel.
        const fragmentShader = /* glsl */ `
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2 uMouse;
  uniform vec2 uResolution;
  uniform float uHueShift;

  // cheap pseudo-random noise, standard "book of shaders" trick
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
  }

  vec3 hsl2rgb(vec3 hsl) {
    vec3 rgb = clamp(abs(mod(hsl.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    return hsl.z + hsl.y * (rgb - 0.5) * (1.0 - abs(2.0 * hsl.z - 1.0));
  }

  void main() {
    vec2 uv = vUv;
    vec2 aspectCorrected = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);

    // domain warping: feed noise into itself to get organic flowing shapes
    // instead of flat random static
    vec2 warp = aspectCorrected * 2.0;
    warp += vec2(noise(warp + uTime * 0.05), noise(warp - uTime * 0.05));

    // mouse pushes a soft radial influence into the flow field
    vec2 mouseInfluence = (uMouse - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
    float distToMouse = length(aspectCorrected - mouseInfluence);
    warp += (1.0 - smoothstep(0.0, 0.6, distToMouse)) * 0.6;

    float n = noise(warp);

    float hue = fract(n * 0.35 + uTime * 0.015 + uHueShift);
    float lightness = 0.35 + n * 0.25;
    vec3 color = hsl2rgb(vec3(hue, 0.55, lightness));

    gl_FragColor = vec4(color, 1.0);
  }
`;

        const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        /* ----------------------------------------------------------------------
           STEP 4 — the render loop. This runs ~60 times a second.
           Every frame: update uniforms, ask the renderer to draw the scene.
        ---------------------------------------------------------------------- */
        const clock = new THREE.Clock();

        function animate() {
            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        /* ----------------------------------------------------------------------
           Interaction + responsiveness
        ---------------------------------------------------------------------- */
        window.addEventListener('mousemove', (e) => {
            uniforms.uMouse.value.set(
                e.clientX / window.innerWidth,
                1.0 - e.clientY / window.innerHeight // flip Y: screen space vs UV space
            );
        });

        window.addEventListener('wheel', (e) => {
            uniforms.uHueShift.value += e.deltaY * 0.0003;
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
